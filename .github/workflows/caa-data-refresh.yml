# caa-data-refresh — WP5 (07-implementation-plan.md WP5; 03-data-pipeline.md §6.1). Handed over from the
# WP0 skeleton by the commit "handoff: workflow skeletons → WP5 (refresh, probe, staleness), WP11 (ci),
# WP10 (ci web block)".
#
# Triggers (orchestrator override 3, which replaces the plan's push: claude/** trigger):
# - schedule: runs ONLY on the default branch (main) [T]; off the hour (doc 09 §5.2).
# - workflow_dispatch: manual; GitHub needs this file on main before it can be dispatched
#   (03 §6.2), then `gh workflow run caa-data-refresh.yml --ref <branch>`. Dispatch runs COMMIT unless
#   dry_run is ticked.
# - push to claude/cuban-immigration-tracker-b6y4b1 ONLY when cuban-immigration-tracker/data/.refresh-request
#   changes. The orchestrator touches that file once, after the build, so bot data commits never race
#   agent pushes. That run COMMITS: GitHub's runners have open internet, so it fetches the real
#   USCIS / Federal Register / CourtListener data that the build sandbox cannot reach.
# Least privilege (05 §3.1; review round 1): nothing at workflow level. The work is split in two jobs:
# - `refresh` (contents: read) runs npm ci, tsx and the parsers (exceljs, sql.js, fast-xml-parser,
#   csv-parse) over files downloaded from the internet. It holds NO write token: checkout uses
#   persist-credentials: false and the ingest step gets no GITHUB_TOKEN (its only use, the public
#   jzebedee latest-release lookup in refresh.ts, works unauthenticated within the 60/h limit). It uploads
#   data/ (minus data/curated and .refresh-request) as a short-lived workflow artifact.
# - `commit` (contents: write, default GITHUB_TOKEN, no PAT) runs NO npm code: it checks out the same
#   commit, mirrors the artifact into data/, and commits ONLY under cuban-immigration-tracker/data/ (never
#   data/curated, the human-reviewed inputs), with `git pull --rebase` before `git push`.
# issues: write lives on the separate notify job. `[skip ci]` keeps CI off bot commits; the push path
# filter cannot match the files the bot writes, so there is no loop.
name: caa-data-refresh

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma list of source keys (blank = all): uscis.monthly_csv, uscis.quarterly_all_forms, uscis.i485_by_office, mirror.jzebedee, fr.api, uscis.rss, courtlistener.v4, curated"
        required: false
        default: ""
      dry_run:
        description: "parse + QA, do not commit"
        type: boolean
        default: false
  push:
    branches: ["claude/cuban-immigration-tracker-b6y4b1"]
    paths:
      - "cuban-immigration-tracker/data/.refresh-request"

permissions: {}

concurrency:
  group: "caa-data-refresh-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    working-directory: cuban-immigration-tracker

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      should_commit: ${{ steps.ingest.outputs.should_commit }}
      summary: ${{ steps.ingest.outputs.summary }}
      data_month: ${{ steps.ingest.outputs.data_month }}
      new_month: ${{ steps.ingest.outputs.new_month }}
      new_quarter: ${{ steps.ingest.outputs.new_quarter }}
      qa_status: ${{ steps.ingest.outputs.qa_status }}
      alerts_changed: ${{ steps.ingest.outputs.alerts_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          # No token in .git/config for the npm/parser steps below.
          persist-credentials: false

      - id: head
        name: Record the checked-out commit (the commit job checks out the same one)
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: present
        name: Code present on this ref?
        working-directory: .
        run: |
          if [ -f cuban-immigration-tracker/package.json ] && [ -f cuban-immigration-tracker/packages/ingestion/src/cli.ts ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "code not on this ref yet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.present.outputs.ok == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: cuban-immigration-tracker/package-lock.json

      - if: ${{ steps.present.outputs.ok == 'true' }}
        run: npm ci --ignore-scripts

      - id: ingest
        if: ${{ steps.present.outputs.ok == 'true' }}
        name: Ingest (03 §2–§7; writes data/ only when content changed or the 7-day heartbeat is due)
        # No GITHUB_TOKEN here on purpose (least privilege): the GitHub release lookup runs unauthenticated.
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Inputs arrive through env, never interpolated into the script (injection-safe).
          set -- --only "$ONLY" --github-output "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          npm run data:refresh -- "$@"

      - name: Hand data/ to the commit job
        if: ${{ steps.present.outputs.ok == 'true' && github.event_name != 'pull_request' && inputs.dry_run != true && steps.ingest.outputs.should_commit == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caa-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cuban-immigration-tracker/data/
            !cuban-immigration-tracker/data/curated/**
            !cuban-immigration-tracker/data/.refresh-request
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: refresh
    if: ${{ github.event_name != 'pull_request' && inputs.dry_run != true && needs.refresh.outputs.should_commit == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a write token. It runs no npm/tsx/parser code: checkout, download, rsync, git.
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: caa-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/caa-data

      - id: commit
        name: Commit data/** only (content changed or 7-day heartbeat)
        env:
          SUMMARY: ${{ needs.refresh.outputs.summary }}
          NEW_MONTH: ${{ needs.refresh.outputs.new_month }}
          DATA_MONTH: ${{ needs.refresh.outputs.data_month }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Mirror the ingest output into data/ (deletions included); curated inputs and the refresh
          # request are never touched. --no-links: a symlink from the artifact is never followed or copied.
          rsync -r --delete --no-links --exclude '/curated/' --exclude '/.refresh-request' "$RUNNER_TEMP/caa-data/" data/
          git config user.name "caa-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git reset -q -- data/curated data/.refresh-request
          if git diff --cached --quiet; then echo "nothing staged"; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: ${SUMMARY} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              # 03 §7: a lightweight tag per new official month (covered by contents: write).
              if [ "$NEW_MONTH" = "true" ] && [ -n "$DATA_MONTH" ]; then
                tag="caa-data-${DATA_MONTH}"
                if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                  git tag "$tag" && git push origin "refs/tags/$tag" || echo "tag $tag not pushed"
                fi
              fi
              exit 0
            fi
            sleep $((i * 10))
          done
          exit 1

  notify:
    needs: [refresh, commit]
    if: ${{ always() && (needs.refresh.result == 'failure' || needs.commit.result == 'failure' || (needs.refresh.outputs.qa_status != '' && needs.refresh.outputs.qa_status != 'ok') || needs.refresh.outputs.new_month == 'true' || needs.refresh.outputs.new_quarter == 'true' || needs.refresh.outputs.alerts_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Upsert notification issues
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QA: ${{ needs.refresh.outputs.qa_status }}
          RESULT: ${{ needs.refresh.result }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          NEWM: ${{ needs.refresh.outputs.new_month }}
          NEWQ: ${{ needs.refresh.outputs.new_quarter }}
          ALERTS: ${{ needs.refresh.outputs.alerts_changed }}
        run: |
          upsert() {
            n=$(gh issue list -R "$REPO" --state open --search "\"$1\" in:title" --json number -q '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" --body "$2"; else gh issue create -R "$REPO" --title "$1" --body "$2"; fi
          }
          RUN="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = "failure" ] || [ "$COMMIT_RESULT" = "failure" ]; then upsert "CAA data job failed" "Run: $RUN"; fi
          if [ -n "$QA" ] && [ "$QA" != "ok" ]; then upsert "CAA data QA: $QA" "Run: $RUN (see cuban-immigration-tracker/data/quarantine/)"; fi
          if [ "$NEWM" = "true" ] || [ "$NEWQ" = "true" ] || [ "$ALERTS" = "true" ]; then
            upsert "Republish CAA Tracker artifact" "New data (month=$NEWM quarter=$NEWQ alerts=$ALERTS). Follow docs/planning/03-data-pipeline.md §9. Run: $RUN"
          fi
