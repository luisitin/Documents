# caa-data-refresh — WP0 SKELETON (07-implementation-plan.md WP0 step 6; 03-data-pipeline.md §6.1).
# Ownership: handed to WP5 by the commit "handoff: workflow skeletons → WP5 (refresh, probe,
# staleness), WP11 (ci), WP10 (ci web block)". WP0 never edits this file after that commit.
#
# Triggers (orchestrator override 3, which replaces the plan's push: claude/** trigger):
# - schedule: runs ONLY on the default branch (main); off the hour (doc 09 §5.2).
# - workflow_dispatch: manual; GitHub needs this file on main before it can be dispatched
#   (01 §10 R4), then `gh workflow run caa-data-refresh.yml --ref <branch>`.
# - push to claude/cuban-immigration-tracker-b6y4b1 ONLY when cuban-immigration-tracker/data/.refresh-request
#   changes (the orchestrator touches it once after the build, so bot data commits never race
#   agent pushes). GitHub's runners have open internet, so this run fetches the real
#   USCIS / Federal Register / CourtListener data that the build sandbox cannot reach.
# Commits only under cuban-immigration-tracker/data/ (never data/curated), with contents: write on
# the refresh job only, the default GITHUB_TOKEN, and `git pull --rebase` before `git push`.
#
# SKELETON BEHAVIOUR: the ingest step runs `data:refresh -- --dry-run` and is a green no-op until
# WP5 adds packages/ingestion/src/cli.ts. A dry run never sets should_commit, so the skeleton
# never commits. WP5 replaces the ingest step with the real refresh (03 §6.1).
name: caa-data-refresh

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "comma list of source keys (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "parse + QA, do not commit"
        type: boolean
        default: false
  push:
    branches: ["claude/cuban-immigration-tracker-b6y4b1"]
    paths:
      - "cuban-immigration-tracker/data/.refresh-request"

permissions: {}

concurrency:
  group: "caa-data-refresh-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    working-directory: cuban-immigration-tracker

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      new_month: ${{ steps.ingest.outputs.new_month }}
      new_quarter: ${{ steps.ingest.outputs.new_quarter }}
      qa_status: ${{ steps.ingest.outputs.qa_status }}
      alerts_changed: ${{ steps.ingest.outputs.alerts_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - id: present
        name: Code present on this ref?
        working-directory: .
        run: |
          if [ -f cuban-immigration-tracker/package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "code not on this ref yet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.present.outputs.ok == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: cuban-immigration-tracker/package-lock.json

      - if: ${{ steps.present.outputs.ok == 'true' }}
        run: npm ci --ignore-scripts

      - id: ingest
        if: ${{ steps.present.outputs.ok == 'true' }}
        name: Ingest (skeleton = dry run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -f packages/ingestion/src/cli.ts ]; then
            npm run --if-present data:refresh -- --dry-run --only "$ONLY" --github-output "$GITHUB_OUTPUT"
          else
            echo "packages/ingestion/src/cli.ts not present yet (WP5); nothing to ingest"
          fi

      - id: commit
        name: Commit data/** only (content changed or 7-day heartbeat)
        if: ${{ steps.present.outputs.ok == 'true' && github.event_name != 'pull_request' && inputs.dry_run != true && steps.ingest.outputs.should_commit == 'true' }}
        env:
          SUMMARY: ${{ steps.ingest.outputs.summary }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "caa-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git reset -q -- data/curated
          if git diff --cached --quiet; then echo "nothing staged"; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: ${SUMMARY} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 10))
          done
          exit 1

  notify:
    needs: refresh
    if: ${{ always() && (needs.refresh.result == 'failure' || (needs.refresh.outputs.qa_status != '' && needs.refresh.outputs.qa_status != 'ok') || needs.refresh.outputs.new_month == 'true' || needs.refresh.outputs.new_quarter == 'true' || needs.refresh.outputs.alerts_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Upsert notification issues
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QA: ${{ needs.refresh.outputs.qa_status }}
          RESULT: ${{ needs.refresh.result }}
          NEWM: ${{ needs.refresh.outputs.new_month }}
          NEWQ: ${{ needs.refresh.outputs.new_quarter }}
          ALERTS: ${{ needs.refresh.outputs.alerts_changed }}
        run: |
          upsert() {
            n=$(gh issue list -R "$REPO" --state open --search "\"$1\" in:title" --json number -q '.[0].number')
            if [ -n "$n" ]; then gh issue comment "$n" -R "$REPO" --body "$2"; else gh issue create -R "$REPO" --title "$1" --body "$2"; fi
          }
          RUN="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = "failure" ]; then upsert "CAA data job failed" "Run: $RUN"; fi
          if [ -n "$QA" ] && [ "$QA" != "ok" ]; then upsert "CAA data QA: $QA" "Run: $RUN (see data/quarantine/)"; fi
          if [ "$NEWM" = "true" ] || [ "$NEWQ" = "true" ] || [ "$ALERTS" = "true" ]; then
            upsert "Republish CAA Tracker artifact" "New data (month=$NEWM quarter=$NEWQ alerts=$ALERTS). Follow docs/planning/03-data-pipeline.md §9. Run: $RUN"
          fi
