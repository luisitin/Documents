# caa-ci (WP11 owns this file except the marked WP10 `web` block; 03-data-pipeline.md §6.3;
# 07-implementation-plan.md WP11, §7; 05-privacy-security-legal.md §2–§3).
#
# Triggers (orchestrator override 3): push to claude/cuban-immigration-tracker-b6y4b1 and
# pull_request, both limited to the project paths and this file. Scheduled workflows only run on
# the default branch, so CI deliberately has no schedule. CI never commits: every job has
# `contents: read` and checkout does not persist credentials.
#
# Jobs:
#   tools  root tooling: tsc, eslint, vitest, oracle cross-check, JSON Schema drift, strict data
#          validation, i18n check, and the personal-files guard (05 §2).
#   app    the Expo app on its own (no root `npm ci`: proves zod resolves from app/node_modules
#          only, 07 §4): typed routes, `expo install --check`, `expo lint`, tsc, jest.
#   web    (WP10 block) the Claude artifact fragment build and Prove (07 §9).
name: caa-ci

on:
  push:
    branches: ["claude/cuban-immigration-tracker-b6y4b1"]
    paths:
      - "cuban-immigration-tracker/**"
      - ".github/workflows/caa-ci.yml"
      - ".github/CODEOWNERS"
  pull_request:
    paths:
      - "cuban-immigration-tracker/**"
      - ".github/workflows/caa-ci.yml"
      - ".github/CODEOWNERS"

permissions:
  contents: read

concurrency:
  group: "caa-ci-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: cuban-immigration-tracker

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: cuban-immigration-tracker/package-lock.json
      # Root install scripts are not needed (only esbuild's optional binary check and fsevents,
      # which is macOS-only; verified by WP11): 05 §3.1 "npm ci --ignore-scripts".
      - run: npm ci --ignore-scripts
      - name: Personal-files guard (05 §2; warns about the pre-existing owner PDFs, fails on new ones)
        run: node scripts/check-no-personal-files.mjs
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Lint (eslint + typescript-eslint; ARCH-1 purity rules)
        run: npm run lint
      - name: Unit tests (vitest; packages/* incl. golden T1–T32, U1–U8)
        run: npm test
      - name: Oracle cross-check (golden:check; Python stdlib only, 04 §9)
        run: |
          python3 --version
          npm run golden:check
      - name: JSON Schema drift (schema:export --check)
        run: npm run schema:export -- --check
      - name: Validate data/ and data/curated/ (strict zod)
        run: npm run data:validate
      - name: i18n check (key parity, register guard, banned wording)
        run: npm run i18n:check

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cuban-immigration-tracker/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: cuban-immigration-tracker/app/package-lock.json
      # No root `npm ci` in this job: proves the app resolves zod from app/node_modules only (07 §4).
      # Install scripts stay on here (unrs-resolver and @parcel/watcher need their postinstall).
      - run: npm ci
      # Generates .expo/types/router.d.ts and expo-env.d.ts so typedRoutes is enforced by tsc
      # (non-interactive in CI: verified by WP0 acceptance (h)).
      - run: npx expo customize tsconfig.json
      - name: Dependencies match the SDK (expo install --check; online in CI)
        run: npx expo install --check
      - name: Lint (expo lint; ARCH-3 bans, react/jsx-no-literals)
        run: npx expo lint
      - name: Typecheck (tsc, typed routes)
        run: npx tsc --noEmit
      - name: Tests (jest)
        run: npx jest --ci

  # >>> WP10 web block (owned by WP10; 03 §6.3 "web" job; 07 WP10, §9).
  # Builds the Claude artifact fragment from the Expo web export and proves it (P1–P14, sample and
  # live variants) in headless Chromium under the host CSP. Never commits (workflow contents: read).
  web:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: |
            cuban-immigration-tracker/package-lock.json
            cuban-immigration-tracker/app/package-lock.json
      # Root: puppeteer-core + @sparticuz/chromium (ADR WEB-2), tsx and zod (data validation,
      # createFmt expectations). App: the Expo export.
      - run: npm ci
      - run: npm ci
        working-directory: cuban-immigration-tracker/app
      - name: Build-script self-test (routes, escaping, prelude, fragment shape)
        run: node scripts/build-artifact.mjs --self-test
      # The script generates the route list, runs `npx expo export --platform web` (CI is set, so it
      # runs online), inlines JS/CSS/assets into the fragment, copies and validates data/, and
      # asserts that the bundle holds exactly one zod copy (from app/node_modules; 07 §4).
      - name: Build the artifact (npm run build:artifact)
        run: npm run build:artifact -- --check-single-zod
      - name: Prove (sample + live variants)
        run: npm run prove
      - name: Summary
        if: always()
        run: |
          {
            echo "### CAA Tracker web artifact"
            if [ -f web-artifact/.build/summary.json ]; then echo '```json'; cat web-artifact/.build/summary.json; echo '```'; fi
            if [ -f prove-out/report.json ]; then
              # The JS template literals must NOT be expanded by the shell, so single quotes are intended.
              # shellcheck disable=SC2016
              node -e 'const r=require("./prove-out/report.json");console.log(`Prove: **${r.passed} passed, ${r.failed} failed** (${r.browser})`);for(const f of r.results.filter(x=>!x.ok))console.log(`- FAIL ${f.id} ${f.name}`)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: caa-web-artifact
          path: |
            cuban-immigration-tracker/web-artifact/
            cuban-immigration-tracker/prove-out/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  # <<< WP10 web block
